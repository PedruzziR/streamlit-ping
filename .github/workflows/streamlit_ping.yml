# Secrets necessários no repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_URL          → URL do seu projeto Supabase (ex: https://xxxx.supabase.co)
#   SUPABASE_SERVICE_KEY  → service_role key do Supabase (não a anon key)

name: Streamlit App Ping

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch:           # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python streamlit_ping.py
