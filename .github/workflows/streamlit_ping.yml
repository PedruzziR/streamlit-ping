# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_URL          → URL do projeto Supabase
#   SUPABASE_SERVICE_KEY  → service_role key do Supabase
#
# Variável opcional (Settings > Secrets and variables > Actions > Variables):
#   PING_APP_URL          → URL deste próprio app após deploy no Streamlit Community Cloud

name: Streamlit App Ping

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 19 apps × 15s = ~5 min + margem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install selenium aiohttp streamlit

      - name: Run ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PING_APP_URL: ${{ vars.PING_APP_URL }}
        run: python streamlit_ping.py
