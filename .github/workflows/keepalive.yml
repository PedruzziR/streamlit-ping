name: Keepalive

on:
  schedule:
    - cron: "0 12 * * 0"   # todo domingo ao meio-dia UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Re-enable scheduled workflows
        run: |
          gh workflow enable streamlit_ping.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
